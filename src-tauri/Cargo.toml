[package]
name = "gif-recorder"
version = "0.1.0"
edition = "2021"

[lib]
name = "gif_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
gifski = "1.34"
image = "0.25"
imgref = "1.11"
lz4_flex = "0.14.0"
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

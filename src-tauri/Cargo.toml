[package]
name = "gif-recorder"
version = "0.1.0"
edition = "2021"

[lib]
name = "gif_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }

[dev-dependencies]
serde_json = "1.0"

[package]
name = "carve"
version = "0.1.0"
edition = "2021"

[lib]
name = "carve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
gifski = "1.34"
image = "0.25"
imgref = "1.11"
lz4_flex = "0.14.0"
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["pipewire", "tokio", "screencast"] }
pipewire = "0.9.2"
libspa = "0.9.2"
tokio = { version = "1.0", features = ["sync", "rt"] }

